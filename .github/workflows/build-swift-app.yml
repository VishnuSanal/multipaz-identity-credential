name: Build Swift Test App

on:
  push:

permissions:
  contents: read

jobs:
  build_swift_app:
    name: Build SwiftTestApp (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode 26
        run: |
          XCODE_PATH=""
          # Check for Xcode 26
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -n 1)
          if [ -n "$XCODE_26" ]; then
            XCODE_PATH="$XCODE_26/Contents/Developer"
          fi

          if [ -d "$XCODE_PATH" ]; then
            echo "Selecting Xcode: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "Xcode 26 not found, using default Xcode version"
          fi
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DeveloperConfig.xcconfig is a gitignored, developer-local file that
      # AdditionalConfig.xcconfig hard-includes. It normally holds the signing
      # DEVELOPMENT_TEAM, but the committed template leaves it empty, which is
      # all a simulator build with CODE_SIGNING_ALLOWED=NO needs.
      - name: Create DeveloperConfig.xcconfig from template
        run: |
          cp samples/testapp/iosApp/DeveloperConfig.xcconfig.template \
             samples/testapp/iosApp/DeveloperConfig.xcconfig

      # Builds the SwiftTestApp for the iOS simulator. The Xcode project has a
      # "Run Script" build phase that invokes
      # ./gradlew :samples:SwiftTestApp:embedAndSignAppleFrameworkForXcode,
      # so this single step compiles + embeds the Kotlin Multipaz XCFramework
      # and then builds the Swift sources. CODE_SIGNING_ALLOWED=NO keeps the
      # simulator build from requiring signing identities.
      #
      # We build with -target (not -scheme) because the project has no shared
      # scheme checked in; -target builds the app without needing one and still
      # runs the target's Gradle build phase.
      - name: Build SwiftTestApp
        run: |
          xcodebuild \
            -project samples/SwiftTestApp/SwiftTestApp.xcodeproj \
            -target SwiftTestApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
