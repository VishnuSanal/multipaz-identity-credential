name: Auto-fill missing translations

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  lokalize-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run lokalizeFix
        env:
          LOKALIZE_API_KEY: ${{ secrets.LOKALIZE_API_KEY }}
        run: ./gradlew lokalizeFix -Pdisable.web.targets=true
      - name: Open PR with generated translations
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "auto: fill missing translations via lokalizeFix"
          title: "Auto: fill missing translations"
          body: |
            Automated translations generated by `./gradlew lokalizeFix`.

            Triggered by: `${{ github.event_name }}`
            Source commit: ${{ github.sha }}

            Please review for brand-specific terminology, cultural context, and UI space constraints before merging.
          branch: auto/lokalize-fix
          delete-branch: true
          labels: |
            localization
            automated
